<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Eddie’s Print Engine | Eddie’s World</title>
<meta name="description" content="Eddie’s Print Engine is the internal production layer behind selected Eddie’s World print outputs." />
<style>
:root{ --purple:#7c3aed; --dark:#2e1065; --white:#ffffff; }
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Helvetica Neue',Arial,sans-serif;background:linear-gradient(135deg,var(--purple),var(--dark));color:var(--white);display:flex;align-items:center;justify-content:center;min-height:100vh;}
.card{text-align:center;padding:48px 24px;border-radius:28px;background:rgba(0,0,0,.25);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);max-width:540px;width:92%;box-shadow:0 25px 50px -12px rgba(0,0,0,.5);}
h1{font-size:36px;font-weight:900;margin-bottom:12px;text-transform:uppercase;letter-spacing:-1px;}
p{margin-bottom:22px;opacity:.88;line-height:1.55;font-size:16px;}
.wall-box{margin:24px 0 16px;padding:24px;background:rgba(255,255,255,.05);border:2px dashed rgba(255,255,255,.2);border-radius:20px;}
.wall-label{display:block;margin-bottom:16px;font-size:12px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:#fff;}
.btn{display:block;margin:12px auto;padding:18px 24px;border-radius:16px;font-weight:900;text-decoration:none;transition:all .2s cubic-bezier(.4,0,.2,1);text-transform:uppercase;font-size:14px;}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 15px -3px rgba(0,0,0,.3);}
.btn:active{transform:scale(.98);}
.primary{background:var(--white);color:var(--dark);}
.secondary{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;}
.ghost{color:rgba(255,255,255,.58);font-size:12px;margin-top:20px;line-height:1.5;}
.brand-accent{color:var(--white);opacity:.62;font-size:11px;font-weight:800;text-transform:uppercase;margin-top:30px;letter-spacing:2px;}
</style>
</head>
<body>
<div class="card">
  <h1>Eddie’s Print Engine</h1>
  <p>Internal production layer for selected Eddie’s World print outputs.<br>Finished books are the public product.</p>

  <div class="wall-box">
    <span class="wall-label">Level 30 is the wall</span>
    <a class="btn primary" href="https://focus-system-unaufhaltsam.github.io/eddie/">Prove your focus</a>
  </div>

  <a class="btn secondary" href="https://focus-system-unaufhaltsam.github.io/eddie/">Back to Eddie’s World</a>

  <div class="ghost">The machine stays inside. The output goes public.</div>
  <div class="brand-accent">Real life. No staging. UNAUFHALTSAM.</div>
</div>
</body>
</html>
